[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scan2plan"
version = "0.1.0"
description = "Phone capture -> stitched whole-property floor plan + damage assessment (Applied AI Engineer case study)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - case study submission" }
authors = [{ name = "case-study author" }]
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.21", "ruff>=0.5", "mypy>=1.10"]
cli = ["typer>=0.12"]
pipeline = ["scipy>=1.11", "shapely>=2.0", "opencv-python>=4.9", "open3d>=0.18"]
render = ["svgwrite>=1.4", "matplotlib>=3.8"]

[project.scripts]
scan2plan = "scan2plan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/scan2plan/cir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
